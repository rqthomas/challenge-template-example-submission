# Makes a new forecast each day and commits it to forecasts/, where the
# challenge finds it. Runs the forecast.R in this repository.
#
# The schedule is off: turn it on once the repository is registered with the
# challenge (see README.md), and the challenge's targets are published.
name: forecast

# Two runs a day, at minutes that are not 0. GitHub's free scheduler starts a run hours late
# (4 to 12 hours is common) and sometimes drops it, and the challenge's deadline for a forecast
# is a date (see "Timing" in README.md): a late run must still commit before midnight UTC, and the
# second run covers a dropped one. A repeat is harmless: the same forecast writes the same file,
# and nothing is committed when it has not changed.
on:
  schedule:
    - cron: '47 5 * * *'
    - cron: '47 13 * * *'
  workflow_dispatch:

# One job at a time changes forecasts/, so a new forecast's commit never races the
# clean-up (cleanup-forecasts.yml) or another forecast.
concurrency:
  group: forecasts-repo
  cancel-in-progress: false

# The workflow commits the new file with the repository's own token.
permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rocker/tidyverse:4.4.2
    steps:
      - uses: actions/checkout@v4

      # The weather comes from dynamical.org through Python (gefs_weather.py).
      # zarr 3 and icechunk need Python 3.11 or newer, which the image may not have, so
      # uv installs one in a virtual environment.
      - name: Install Python and the weather packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv python3-pip
          python3 -m venv /opt/bootstrap
          /opt/bootstrap/bin/pip install --quiet uv
          /opt/bootstrap/bin/uv venv /opt/venv --python 3.12
          /opt/bootstrap/bin/uv pip install --python /opt/venv/bin/python -r requirements.txt
          echo "PYTHON=/opt/venv/bin/python" >> "$GITHUB_ENV"

      # paws.storage, the S3 client, is only used when the challenge's bucket is
      # private (it is plain R: nothing else is installed).
      - name: Install packages
        run: Rscript -e 'install.packages("paws.storage")'

      # Set the secrets S3_KEY and S3_SECRET (a key that can read the challenge's
      # bucket) if the bucket is private. Without them the targets are read by URL.
      - name: Make the forecast
        env:
          S3_KEY: ${{ secrets.S3_KEY }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
        run: Rscript forecast.R

      - name: Commit the forecast
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          git diff --cached --quiet || git commit -m "Forecast for $(date -u +%F)"
          git push
